---
layout: default
---

{% include metadata.liquid %}
{% include header.html %}

<main class="my-4">
    <div class="container">
        <h1 class="display-5">{{ page.title }}</h1>
        <p class="text-muted">Final report from the CAMCAD workshop at CHI 2026.</p>
        <iframe
            id="report-pdf"
            data-src="{{ '/assets/files/CAMCAD-final-report.pdf' | relative_url }}"
            title="CAMCAD Final Report"
            style="width:100%;height:85vh;border:none;display:none;">
        </iframe>
        <p id="report-pdf-unavailable" class="text-muted" style="display:none;">
            PDF preview is not available in this browser.
        </p>
        <p class="mt-3">
            <a class="btn btn-outline-secondary btn-sm me-2" href="{{ '/assets/files/CAMCAD-final-report.pdf' | relative_url }}" download>Download PDF</a>
            <a class="btn btn-outline-secondary btn-sm" href="{{ '/assets/files/CAMCAD-final-report.docx' | relative_url }}" download>Download DOCX</a>
        </p>
        <script>
            var iframe = document.getElementById('report-pdf');
            if (navigator.pdfViewerEnabled) {
                iframe.src = iframe.dataset.src;
                iframe.style.display = 'block';
            } else {
                document.getElementById('report-pdf-unavailable').style.display = 'block';
            }
        </script>
    </div>
</main>

{% include footer.html %}
